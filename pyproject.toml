[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ksb"
version = "0.2.0"
description = "KSB — token-efficient scripting language for AI agents (transpiles to Python)"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "KSB Contributors" }]
keywords = [
  "ksb",
  "language",
  "compiler",
  "ai",
  "agents",
  "transpiler",
  "llm",
  "dsl",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Compilers",
  "Topic :: Software Development :: Interpreters",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/semihbalan/ksb"
Repository = "https://github.com/semihbalan/ksb"
Issues = "https://github.com/semihbalan/ksb/issues"
Documentation = "https://github.com/semihbalan/ksb#readme"
Changelog = "https://github.com/semihbalan/ksb/releases"

[project.optional-dependencies]
dev = ["pytest>=7.0", "build>=1.0", "twine>=5.0"]

[project.scripts]
ksb = "ksb.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
